# === Test: admin.trichologia.mediann.dev ===
# This is a reference copy. The live config on the server is managed by certbot.
server {
    server_name admin.trichologia.mediann.dev;

    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/admin.trichologia.mediann.dev/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/admin.trichologia.mediann.dev/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = admin.trichologia.mediann.dev) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name admin.trichologia.mediann.dev;
    return 404; # managed by Certbot
}

